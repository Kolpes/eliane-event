version: '3.8'
services:
  db:
    image: postgres:15
    container_name: eliane_event_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eliane_event
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eliane_event_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
